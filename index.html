<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoldOrRaise.ai — Preflop GTO Compass</title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Orbitron:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js">
  </script>
  <script src="https://unpkg.com/lucide@latest">
  </script>
  <style>
    :root {
      --bg-deep: #05050f;
      --bg-card: #0a0a1e;
      --bg-cell: #0f0f2a;
      --neon-green: #00ff88;
      --neon-blue: #00d4ff;
      --neon-amber: #f59e0b;
      --neon-red: #ef4444;
      --text-muted: #6b7280;
      --text-bright: #e5e7eb;
      --glow-green: 0 0 20px rgba(0, 255, 136, 0.3);
      --glow-amber: 0 0 20px rgba(245, 158, 11, 0.3);
      --glow-red: 0 0 20px rgba(239, 68, 68, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: var(--bg-deep);
      color: var(--text-bright);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
    }

    .bg-grid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .title-glow {
      text-shadow: 0 0 30px rgba(0, 255, 136, 0.4), 0 0 60px rgba(0, 255, 136, 0.15);
      animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { text-shadow: 0 0 30px rgba(0, 255, 136, 0.4), 0 0 60px rgba(0, 255, 136, 0.15); }
      50% { text-shadow: 0 0 40px rgba(0, 255, 136, 0.6), 0 0 80px rgba(0, 255, 136, 0.25); }
    }

    .privacy-badge {
      border: 1px solid rgba(0, 212, 255, 0.25);
      background: rgba(0, 212, 255, 0.06);
      backdrop-filter: blur(8px);
      animation: fadeInUp 0.8s ease-out 0.3s both;
    }

    .controls-row {
      animation: fadeInUp 0.8s ease-out 0.35s both;
    }

    .control-group-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: rgba(0, 212, 255, 0.5);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .btn-opt {
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.3px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.03);
      color: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .btn-opt:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
    }

    .btn-opt.active-stack {
      background: rgba(0, 255, 136, 0.1);
      border-color: rgba(0, 255, 136, 0.3);
      color: #00ff88;
      text-shadow: 0 0 8px rgba(0, 255, 136, 0.2);
    }

    .btn-opt.active-position {
      background: rgba(0, 212, 255, 0.1);
      border-color: rgba(0, 212, 255, 0.3);
      color: #00d4ff;
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.2);
    }

    .btn-opt:active {
      transform: scale(0.95);
    }

    .matrix-wrapper {
      background: rgba(10, 10, 30, 0.6);
      border: 1px solid rgba(0, 255, 136, 0.1);
      border-radius: 16px;
      padding: 16px 12px;
      backdrop-filter: blur(12px);
      animation: fadeInUp 0.8s ease-out 0.5s both;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: 36px repeat(13, minmax(42px, 1fr));
      gap: 3px;
      user-select: none;
    }

    .matrix-header {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: rgba(0, 255, 136, 0.6);
      letter-spacing: 0.5px;
      height: 28px;
    }

    .matrix-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      height: 32px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .matrix-cell.push {
      background: rgba(0, 255, 136, 0.18);
      border-color: rgba(0, 255, 136, 0.15);
      color: #a7f3d0;
    }

    .matrix-cell.play {
      background: rgba(245, 158, 11, 0.18);
      border-color: rgba(245, 158, 11, 0.15);
      color: #fde68a;
    }

    .matrix-cell.fold {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.08);
      color: #fca5a5;
    }

    .matrix-cell.push:hover {
      background: rgba(0, 255, 136, 0.35);
      border-color: rgba(0, 255, 136, 0.6);
      box-shadow: var(--glow-green);
      transform: scale(1.08);
      z-index: 2;
    }

    .matrix-cell.play:hover {
      background: rgba(245, 158, 11, 0.35);
      border-color: rgba(245, 158, 11, 0.6);
      box-shadow: var(--glow-amber);
      transform: scale(1.08);
      z-index: 2;
    }

    .matrix-cell.fold:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.4);
      box-shadow: var(--glow-red);
      transform: scale(1.08);
      z-index: 2;
    }

    .matrix-cell.active.push {
      background: rgba(0, 255, 136, 0.4);
      border-color: #00ff88;
      box-shadow: var(--glow-green);
      transform: scale(1.1);
      z-index: 3;
    }

    .matrix-cell.active.play {
      background: rgba(245, 158, 11, 0.4);
      border-color: #f59e0b;
      box-shadow: var(--glow-amber);
      transform: scale(1.1);
      z-index: 3;
    }

    .matrix-cell.active.fold {
      background: rgba(239, 68, 68, 0.3);
      border-color: #ef4444;
      box-shadow: var(--glow-red);
      transform: scale(1.1);
      z-index: 3;
    }

    .matrix-cell .corner {
      position: absolute;
      top: 1px;
      right: 2px;
      font-size: 6px;
      opacity: 0.7;
      font-weight: 400;
    }

    @keyframes cellReveal {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .matrix-cell {
      animation: cellReveal 0.3s ease-out both;
    }

    .decision-panel {
      background: rgba(10, 10, 30, 0.7);
      border: 1px solid rgba(0, 255, 136, 0.12);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(12px);
      min-height: 180px;
      animation: fadeInUp 0.8s ease-out 0.7s both;
      transition: all 0.3s ease;
    }

    .decision-panel.has-selection {
      border-color: rgba(0, 255, 136, 0.3);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes countUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .equity-bar-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }

    .equity-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .equity-number {
      font-family: 'Orbitron', 'JetBrains Mono', monospace;
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
      animation: countUp 0.4s ease-out;
    }

    .action-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .action-badge.push {
      background: rgba(0, 255, 136, 0.15);
      color: #00ff88;
      border: 1px solid rgba(0, 255, 136, 0.3);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.15);
    }

    .action-badge.play {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.15);
    }

    .action-badge.fold {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.15);
    }

    .hand-display {
      font-family: 'Orbitron', 'JetBrains Mono', monospace;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .footer-card {
      background: rgba(10, 10, 30, 0.5);
      border: 1px solid rgba(0, 212, 255, 0.1);
      border-radius: 16px;
      padding: 28px 24px;
      backdrop-filter: blur(8px);
      animation: fadeInUp 0.8s ease-out 0.9s both;
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      text-decoration: none;
      cursor: pointer;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      color: var(--text-bright);
    }

    .btn-ghost.primary {
      border-color: rgba(0, 255, 136, 0.2);
      color: #00ff88;
    }

    .btn-ghost.primary:hover {
      background: rgba(0, 255, 136, 0.1);
      border-color: rgba(0, 255, 136, 0.4);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
    }

    .legal-text {
      font-size: 10px;
      color: rgba(107, 114, 128, 0.6);
      line-height: 1.6;
      max-width: 700px;
    }

    .glow-border {
      position: relative;
    }

    .glow-border::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.3), transparent);
    }

    .tooltip-equity {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(0, 255, 136, 0.2);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 10;
    }

    .matrix-cell:hover .tooltip-equity {
      opacity: 1;
    }

    .lang-toggle {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 136, 0.2);
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .lang-toggle:hover {
      border-color: rgba(0, 255, 136, 0.4);
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.1);
    }

    .lang-toggle:active {
      transform: scale(0.95);
    }

    .lang-option {
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      color: rgba(255, 255, 255, 0.3);
    }

    .lang-option.active {
      color: #00ff88;
      background: rgba(0, 255, 136, 0.12);
      text-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
    }

    .scroll-hint {
      display: none;
    }

    @media (max-width: 860px) {
      .matrix-wrapper {
        overflow-x: auto;
        padding: 12px 8px;
      }
      .matrix-grid {
        grid-template-columns: 32px repeat(13, minmax(38px, 1fr));
        gap: 2px;
        min-width: 640px;
      }
      .matrix-cell {
        font-size: 9px;
        height: 28px;
      }
      .matrix-header {
        font-size: 10px;
        height: 24px;
      }
      .scroll-hint {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 11px;
        color: rgba(0, 212, 255, 0.4);
        margin-bottom: 8px;
      }
      .equity-number {
        font-size: 36px;
      }
      .hand-display {
        font-size: 28px;
      }
    }

    @media (max-width: 480px) {
      .app-container {
        padding: 12px 8px 24px;
      }
      .decision-panel {
        padding: 16px;
      }
      .footer-card {
        padding: 20px 16px;
      }
      .equity-number {
        font-size: 28px;
      }
      .hand-display {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-noise"></div>
  <div class="bg-grid-overlay"></div>

  <div id="app" class="app-container">
    <div class="text-center mb-5">
      <div class="flex items-center justify-center gap-3 mb-2">
        <h1 class="text-4xl md:text-5xl font-black tracking-tight title-glow"
            style="font-family: 'Orbitron', 'JetBrains Mono', monospace; color: #00ff88;">
          {{ t('title') }}
        </h1>
        <div class="lang-toggle" @click="toggleLang">
          <span class="lang-option" :class="{ active: currentLang === 'en' }">EN</span>
          <span class="lang-option" :class="{ active: currentLang === 'zh' }">中</span>
        </div>
      </div>
      <p class="text-base md:text-lg text-gray-400 mt-1 font-medium tracking-wide"
         style="font-family: 'Orbitron', 'JetBrains Mono', monospace;">
        {{ t('subtitle') }}
      </p>
      <div class="privacy-badge inline-flex items-center gap-2 px-4 py-2 rounded-full mt-3 text-xs md:text-sm text-cyan-300">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>{{ t('privacyBadge') }}</span>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-5 sm:gap-8 mb-4 controls-row">
      <div class="flex flex-col items-center">
        <div class="control-group-label">{{ t('controls.stackLabel') }}</div>
        <div class="flex gap-2">
          <button v-for="opt in stackOptions" :key="opt"
                  class="btn-opt"
                  :class="{ 'active-stack': currentStack === opt }"
                  @click="setStack(opt)">
            {{ opt }} BB
          </button>
        </div>
      </div>
      <div class="flex flex-col items-center">
        <div class="control-group-label">{{ t('controls.positionLabel') }}</div>
        <div class="flex gap-2">
          <button v-for="opt in positionOptions" :key="opt.value"
                  class="btn-opt"
                  :class="{ 'active-position': currentPosition === opt.value }"
                  @click="setPosition(opt.value)">
            {{ opt.label }}
          </button>
        </div>
      </div>
    </div>

    <div class="matrix-wrapper">
      <div class="scroll-hint">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        <span>{{ t('scrollHint') }}</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="matrix-grid" :style="{ '--cell-count': matrix.length * matrix[0].length }">
        <div class="matrix-header"></div>
        <div class="matrix-header" v-for="rank in ranks" :key="'col-' + rank">{{ rank }}</div>

        <template v-for="(row, i) in matrix" :key="'row-' + i">
          <div class="matrix-header">{{ ranks[i] }}</div>
          <div v-for="(cell, j) in row"
               :key="'cell-' + i + '-' + j"
               class="matrix-cell"
               :class="[cell.action.toLowerCase(), { active: selectedCell && selectedCell.i === i && selectedCell.j === j }]"
               :style="{ animationDelay: ((i * 13 + j) * 6) + 'ms' }"
               @mouseenter="onHover(i, j)"
               @click="onSelect(i, j)">
            <span>{{ cell.label }}</span>
            <span class="corner" v-if="cell.action === 'PUSH'">▲</span>
            <span class="corner" v-else-if="cell.action === 'PLAY'">◆</span>
            <span class="corner" v-else>▼</span>
            <div class="tooltip-equity">{{ cell.equity }}%</div>
          </div>
        </template>
      </div>
    </div>

    <div class="decision-panel mt-5" :class="{ 'has-selection': selectedCell !== null }">
      <template v-if="selectedCell">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
          <div>
            <div class="text-xs text-gray-500 mb-1 font-medium tracking-wider">{{ t('panel.handTitle') }}</div>
            <div class="hand-display" :style="{ color: selectedActionColor }">{{ selectedCell.label }}</div>
          </div>
          <div class="text-right md:text-right">
            <div class="text-xs text-gray-500 mb-1 font-medium tracking-wider">{{ t('panel.actionTitle') }}</div>
            <div class="action-badge" :class="selectedCell.action.toLowerCase()">
              <svg v-if="selectedCell.action === 'PUSH'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 18 12 6 2 18"/></svg>
              <svg v-else-if="selectedCell.action === 'PLAY'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <svg v-else xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 6 12 18 22 6"/></svg>
              {{ actionLabel }}
            </div>
          </div>
        </div>

        <div class="mt-5 grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <div class="text-xs text-gray-500 mb-1 font-medium tracking-wider">{{ t('panel.equityTitle') }}</div>
            <div class="flex items-end gap-3">
              <div class="equity-number" :style="{ color: selectedActionColor }">{{ displayEquity }}</div>
              <div class="text-sm text-gray-500 mb-1">%</div>
            </div>
            <div class="equity-bar-track">
              <div class="equity-bar-fill" :style="{ width: displayEquity + '%', background: selectedActionColor }"></div>
            </div>
          </div>
          <div class="flex flex-col justify-center gap-2">
            <div class="text-xs text-gray-500 font-medium tracking-wider">{{ t('panel.categoryTitle') }}</div>
            <div class="text-sm font-medium" :style="{ color: selectedActionColor }">
              {{ actionCategory }}
            </div>
            <div class="text-xs text-gray-600 mt-1 leading-relaxed">
              {{ actionDescription }}
            </div>
          </div>
        </div>
      </template>

      <template v-else>
        <div class="flex items-center justify-center min-h-[120px]">
          <div class="text-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-2" style="color: rgba(0, 255, 136, 0.2);">
              <path d="M17.5 12h-15"/>
              <path d="M17.5 12L12 7.5"/>
              <path d="M17.5 12L12 16.5"/>
              <path d="M20 7.5V16.5"/>
            </svg>
            <div class="text-sm font-medium" style="color: rgba(0, 255, 136, 0.3);">
              {{ t('panel.placeholder.title') }}
            </div>
            <div class="text-xs mt-1" style="color: rgba(0, 255, 136, 0.15);">
              {{ t('panel.placeholder.sub') }}
            </div>
          </div>
        </div>
      </template>
    </div>

    <div class="footer-card mt-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-emerald-400 to-cyan-500 flex items-center justify-center text-black font-black text-sm" style="font-family: 'Orbitron', 'JetBrains Mono', monospace;">
            Q
          </div>
          <div>
            <div class="text-sm font-semibold text-gray-300">{{ t('footer.dev') }}<span class="text-emerald-400"> (huangq-dev)</span></div>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <a href="https://github.com/huangq-dev/fold-or-raise" target="_blank" rel="noopener noreferrer" class="btn-ghost">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
            {{ t('footer.githubBtn') }}
          </a>
        </div>
      </div>
      <div class="mt-4 pt-4 border-t border-gray-800/50">
        <p class="legal-text">
          {{ t('footer.legal') }}
        </p>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed } = Vue;

    const RANKS = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];

    const DEFAULT_PUSH = new Set([
      'AA', 'KK', 'QQ', 'JJ', 'TT', '99',
      'AKs', 'AKo', 'AQs', 'AQo', 'AJs', 'ATs', 'KQs'
    ]);

    const DEFAULT_PLAY = new Set([
      '88', '77', 'A9s', 'A8s', 'KJs', 'KTs', 'QJs', 'JTs'
    ]);

    const EQUITY_MAP = {
      'AA': 85, 'KK': 82, 'QQ': 80, 'JJ': 77, 'TT': 75, '99': 72,
      '88': 69, '77': 66, '66': 60, '55': 57, '44': 54, '33': 51, '22': 48,
      'AKs': 67, 'AKo': 65, 'AQs': 65, 'AQo': 63, 'AJs': 63, 'ATs': 61,
      'A9s': 55, 'A8s': 53, 'A7s': 50, 'A6s': 48, 'A5s': 47, 'A4s': 45, 'A3s': 44, 'A2s': 43,
      'AJo': 60, 'KQs': 62, 'KJs': 60, 'KTs': 58,
      'QJs': 59, 'JTs': 57
    };

    const POSITION_EQUITY_ADJ = { UTG: -5, CO: 0, BTN: 5 };

    const i18n = {
      en: {
        title: 'FoldOrRaise.ai',
        subtitle: '— Hyper-Fast Preflop GTO Compass —',
        privacyBadge: '100% Client-Side. No Servers. Zero Tracking. Provably Private.',
        scrollHint: 'Scroll horizontally to explore all hands',
        controls: {
          stackLabel: 'Stack Depth',
          positionLabel: 'Position'
        },
        panel: {
          handTitle: 'SELECTED HAND',
          actionTitle: 'GTO ACTION',
          equityTitle: 'EQUITY vs Random',
          categoryTitle: 'HAND CATEGORY',
          placeholder: {
            title: 'Hover or click any cell in the matrix',
            sub: 'to see GTO-optimized preflop action'
          }
        },
        actions: {
          PUSH: {
            badge: 'All-In',
            category: 'Premium — Strong Value Hand',
            desc: "This hand has significant equity advantage. Nash equilibrium recommends pushing to maximize fold equity and realize your hand's value."
          },
          PLAY: {
            badge: 'Call / Play',
            category: 'Speculative — Playable Hand',
            desc: 'This hand has moderate playability with implied odds. Suitable for calling in position or completing from the blinds.'
          },
          FOLD: {
            badge: 'Fold',
            category: 'Marginal — Not Profitable to Play',
            desc: 'This hand lacks sufficient equity against a calling range. Folding preserves your stack for more profitable opportunities.'
          }
        },
        footer: {
          dev: 'Developed by Quentin',
          githubBtn: 'View on GitHub',
          legal: 'Legal Disclaimer: This is a purely offline mathematical training utility. It features NO multiplayer functions and NO real-money wagering capabilities. 100% legal & compliant.'
        }
      },
      zh: {
        title: 'FoldOrRaise.ai',
        subtitle: '— 翻牌前 GTO 极限算力罗盘 —',
        privacyBadge: '100% 纯前端运行 · 零服务器 · 零追踪 · 物理级隐私安全',
        scrollHint: '左右滑动以查看完整手牌方阵',
        controls: {
          stackLabel: '筹码深度',
          positionLabel: '当前位置'
        },
        panel: {
          handTitle: '已选手牌',
          actionTitle: 'GTO 决策建议',
          equityTitle: '对抗随机手牌胜率',
          categoryTitle: '手牌评级',
          placeholder: {
            title: '悬停或点击方阵中的任意手牌',
            sub: '获取 GTO 级别的翻牌前决策建议'
          }
        },
        actions: {
          PUSH: {
            badge: '直接全下 (All-In)',
            category: '极佳 — 强价值手牌',
            desc: '该手牌具有显著的胜率优势。纳什均衡建议直接全下，以最大化弃牌权益并变现你的手牌价值。'
          },
          PLAY: {
            badge: '跟注 / 入池 (Call)',
            category: '投机 — 可玩手牌',
            desc: '该手牌具有中等的强弱可变性和潜在底池赔率。适合在有利位置跟注，或在盲位完成防守。'
          },
          FOLD: {
            badge: '直接弃牌 (Fold)',
            category: '边缘 — 长期入池无利润',
            desc: '该手牌面对对手的接长范围时缺乏足够的胜率。果断弃牌能保护你的筹码，留待更有利的机会。'
          }
        },
        footer: {
          dev: '由 Quentin 倾力研发',
          githubBtn: '前往 GitHub',
          legal: '法律免责声明：本项目仅为一个纯线下的数学训练工具。不具备任何多玩家联机功能，亦不具备任何法定货币或虚拟货币的博弈结算功能。100% 合法合规。'
        }
      }
    };

    function getEquity(i, j, position) {
      const label = getLabel(i, j);
      const base = EQUITY_MAP[label] || getFallbackEquity(i, j);
      const adj = POSITION_EQUITY_ADJ[position] || 0;
      return Math.max(5, Math.min(99, base + adj));
    }

    function getFallbackEquity(i, j) {
      if (i === j) {
        return Math.max(48, 66 - (i - 6) * 6);
      }
      const gap = Math.abs(i - j);
      const maxRank = Math.min(i, j);
      const base = i < j ? 42 : 35;
      const gapPenalty = gap * 3;
      const rankBonus = (12 - maxRank) * 1.5;
      return Math.max(18, Math.min(50, base - gapPenalty + rankBonus));
    }

    function getAction(label, position, stack) {
      if (position === 'UTG') {
        const UTG_PUSH = new Set(['AA', 'KK', 'QQ', 'JJ', 'AKs', 'AKo']);
        const UTG_PLAY = new Set(['TT', '99', 'AQs']);
        if (UTG_PUSH.has(label)) return 'PUSH';
        if (UTG_PLAY.has(label)) return 'PLAY';
        return 'FOLD';
      }

      if (position === 'BTN') {
        if (stack === '10') {
          const BTN10_PUSH = new Set([
            'AA', 'KK', 'QQ', 'JJ', 'TT', '99',
            'AKs', 'AKo', 'AQs', 'AQo', 'AJs', 'ATs', 'KQs',
            '88', '77', '66', 'A9s', 'A8s', 'KJs', 'KTs', 'QJs', 'JTs'
          ]);
          const BTN10_PLAY = new Set([
            '55', '44', '33', '22',
            'A7s', 'A6s', 'A5s', 'A4s', 'A3s', 'A2s',
            'K9s', 'Q9s', 'J9s', 'T9s', '98s', '87s', '76s', '65s', '54s',
            'AJo', 'ATo', 'KQo'
          ]);
          if (BTN10_PUSH.has(label)) return 'PUSH';
          if (BTN10_PLAY.has(label)) return 'PLAY';
          return 'FOLD';
        } else {
          const BTN_PUSH = new Set([
            'AA', 'KK', 'QQ', 'JJ', 'TT', '99',
            'AKs', 'AKo', 'AQs', 'AQo', 'AJs', 'ATs', 'KQs',
            'AJo', 'ATo', 'KQo'
          ]);
          const BTN_PLAY = new Set([
            '88', '77', '66', '55', '44', '33', '22',
            'A9s', 'A8s', 'A7s', 'A6s', 'A5s', 'A4s', 'A3s', 'A2s',
            'KJs', 'KTs', 'K9s', 'QJs', 'Q9s', 'JTs', 'J9s', 'T9s',
            '98s', '87s', '76s', '65s', '54s'
          ]);
          if (BTN_PUSH.has(label)) return 'PUSH';
          if (BTN_PLAY.has(label)) return 'PLAY';
          return 'FOLD';
        }
      }

      if (DEFAULT_PUSH.has(label)) return 'PUSH';
      if (DEFAULT_PLAY.has(label)) return 'PLAY';
      return 'FOLD';
    }

    function getLabel(i, j) {
      if (i === j) return RANKS[i] + RANKS[j];
      if (i < j) return RANKS[i] + RANKS[j] + 's';
      return RANKS[i] + RANKS[j] + 'o';
    }

    function buildMatrix(position, stack) {
      const matrix = [];
      for (let i = 0; i < 13; i++) {
        const row = [];
        for (let j = 0; j < 13; j++) {
          const label = getLabel(i, j);
          row.push({
            label: label,
            action: getAction(label, position, stack),
            equity: getEquity(i, j, position)
          });
        }
        matrix.push(row);
      }
      return matrix;
    }

    const app = createApp({
      setup() {
        const matrix = computed(() => buildMatrix(currentPosition.value, currentStack.value));
        const ranks = ref(RANKS);
        const selectedCell = ref(null);
        const hoveredCell = ref(null);
        const displayEquity = ref(0);
        const currentLang = ref('en');
        const currentStack = ref('15');
        const currentPosition = ref('CO');
        const stackOptions = ref(['10', '15', '25']);
        const positionOptions = ref([
          { value: 'UTG', label: 'UTG' },
          { value: 'CO', label: 'CO' },
          { value: 'BTN', label: 'BTN' }
        ]);
        let equityInterval = null;

        const selectedActionColor = computed(() => {
          if (!selectedCell.value) return '#00ff88';
          switch (selectedCell.value.action) {
            case 'PUSH': return '#00ff88';
            case 'PLAY': return '#f59e0b';
            case 'FOLD': return '#ef4444';
            default: return '#00ff88';
          }
        });

        function t(keyPath) {
          const keys = keyPath.split('.');
          let value = i18n[currentLang.value];
          for (const k of keys) {
            if (value && typeof value === 'object' && k in value) {
              value = value[k];
            } else {
              return keyPath;
            }
          }
          return value;
        }

        const actionLabel = computed(() => {
          if (!selectedCell.value) return '';
          return t('actions.' + selectedCell.value.action + '.badge');
        });

        const actionCategory = computed(() => {
          if (!selectedCell.value) return '';
          return t('actions.' + selectedCell.value.action + '.category');
        });

        const actionDescription = computed(() => {
          if (!selectedCell.value) return '';
          return t('actions.' + selectedCell.value.action + '.desc');
        });

        function animateEquity(target) {
          if (equityInterval) clearInterval(equityInterval);
          const start = 0;
          const diff = target - start;
          const duration = 400;
          const steps = 20;
          const stepTime = duration / steps;
          let step = 0;
          equityInterval = setInterval(() => {
            step++;
            const progress = Math.min(step / steps, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            displayEquity.value = Math.round(start + diff * eased);
            if (progress >= 1) {
              clearInterval(equityInterval);
              equityInterval = null;
            }
          }, stepTime);
        }

        function toggleLang() {
          currentLang.value = currentLang.value === 'en' ? 'zh' : 'en';
        }

        function setStack(val) {
          currentStack.value = val;
          selectedCell.value = null;
          displayEquity.value = 0;
        }

        function setPosition(val) {
          currentPosition.value = val;
          selectedCell.value = null;
          displayEquity.value = 0;
        }

        function updateSelection(i, j) {
          const cell = {
            i,
            j,
            label: matrix.value[i][j].label,
            action: matrix.value[i][j].action,
            equity: matrix.value[i][j].equity
          };
          selectedCell.value = cell;
          animateEquity(cell.equity);
        }

        function onHover(i, j) {
          hoveredCell.value = { i, j };
          updateSelection(i, j);
        }

        function onSelect(i, j) {
          updateSelection(i, j);
        }

        return {
          matrix,
          ranks,
          selectedCell,
          hoveredCell,
          displayEquity,
          currentLang,
          currentStack,
          currentPosition,
          stackOptions,
          positionOptions,
          selectedActionColor,
          t,
          actionLabel,
          actionCategory,
          actionDescription,
          toggleLang,
          setStack,
          setPosition,
          onHover,
          onSelect
        };
      }
    });

    app.mount('#app');

    setTimeout(() => {
      if (window.lucide) {
        lucide.createIcons();
      }
    }, 100);
  </script>
</body>
</html>
